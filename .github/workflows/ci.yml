name: CI

# Runs on every push and pull request. Before this existed the only build was the
# release build, so a compile error or a failing test was discovered by tagging.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # Actions are pinned by commit SHA: a mutable tag means someone else can
      # change what runs in this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config

      # No `cargo fmt --check`: the crate has never been rustfmt-formatted, and
      # enabling it would mean a whole-crate reformat that buries every real
      # change under whitespace. Worth doing as its own commit.
      - run: cargo clippy --all-targets -- -D warnings

      # The ignored tests need a real SOCKS server on the machine, so they stay
      # ignored here rather than failing for the wrong reason.
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      # There is no build step and no dependencies; this catches the class of
      # error that once shipped an unclosed string literal and left the app
      # showing nothing but the splash screen.
      - name: Syntax-check the frontend
        run: |
          node --check src/app.js
          for f in supabase/*.mjs scripts/*.mjs src/assets/badges/_gen.mjs; do
            node --check "$f"
          done

      - name: Badge catalog is in sync with the generator
        run: |
          node src/assets/badges/_gen.mjs
          git diff --exit-code -- src/assets/badges/badges.json

      - name: docs/ badge copy is in sync
        run: |
          node scripts/sync-docs-badges.mjs
          git diff --exit-code -- docs/assets/badges

      - name: FULL_SCHEMA.sql matches migrations/
        run: |
          node supabase/build_sql.mjs
          git diff --exit-code -- supabase/FULL_SCHEMA.sql
