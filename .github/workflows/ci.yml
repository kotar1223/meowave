name: CI

# Runs on every push and pull request. Before this existed the only build was the
# release build, so a compile error or a failing test was discovered by tagging.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # Actions are pinned by commit SHA: a mutable tag means someone else can
      # change what runs in this repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libasound2-dev pkg-config

      # The app embeds dist/ (tauri::generate_context!), which Vite builds from
      # src/ — so the interface is built on every OS, not only in the frontend
      # job: a Windows path or line-ending problem in the build shows up here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Build the interface (Vite → dist/)
        working-directory: .
        shell: bash
        run: |
          npm ci
          npm run web:build

      # No `cargo fmt --check`: the crate has never been rustfmt-formatted, and
      # enabling it would mean a whole-crate reformat that buries every real
      # change under whitespace. Worth doing as its own commit.
      - run: cargo clippy --all-targets -- -D warnings

      # The ignored tests need a real SOCKS server on the machine, so they stay
      # ignored here rather than failing for the wrong reason.
      - run: cargo test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The classic scripts are not compiled, so a syntax error in one of them
      # reaches the window as is — this catches the class of error that once
      # shipped an unclosed string literal and left the app showing nothing
      # but the splash screen.
      - name: Syntax-check the frontend
        run: |
          for f in src/*.js supabase/*.mjs scripts/*.mjs src/assets/badges/_gen.mjs vite.config.mjs; do
            node --check "$f"
          done

      # src/ts is TypeScript (step 2 of the stack rewrite): Vite only strips
      # the types, tsc checks them.
      - name: Type-check src/ts
        run: npm run typecheck

      - name: Build the interface (Vite → dist/)
        run: npm run web:build

      - name: Badge catalog is in sync with the generator
        run: |
          node src/assets/badges/_gen.mjs
          git diff --exit-code -- src/assets/badges/badges.json

      - name: docs/ badge copy is in sync
        run: |
          node scripts/sync-docs-badges.mjs
          git diff --exit-code -- docs/assets/badges

      - name: FULL_SCHEMA.sql matches migrations/
        run: |
          node supabase/build_sql.mjs
          git diff --exit-code -- supabase/FULL_SCHEMA.sql

      # The 290-test tier suite reads src/app.js, src/app.css and src/index.html
      # as text. It ran only when someone remembered to, which is how 18
      # failures accumulated unnoticed — and five of those turned out to be the
      # suite's own bugs, so a silent suite is worse than a broken one.
      - name: E2E tier suite
        run: node tests/run-e2e.mjs
