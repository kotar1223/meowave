name: iOS Build

# Builds Meowave for iOS (Tauri 2 mobile architecture) and produces an unsigned .ipa
# suitable for sideloading via AltStore, Sideloadly, Scarlet, TrollStore, etc.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - '.github/workflows/ios.yml'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting Xcode 16: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          else
            echo "Xcode 16 not found, keeping default Xcode"
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install NPM dependencies and Tauri CLI
        run: |
          npm ci || npm install
          npm install -g @tauri-apps/cli@^2.0.0

      - name: Create mobile externalBin placeholder
        run: |
          mkdir -p src-tauri/ffmpeg
          touch src-tauri/ffmpeg/ffmpeg-aarch64-apple-ios

      - name: Precompile Rust core for iOS
        working-directory: src-tauri
        run: |
          cargo build --release --target aarch64-apple-ios --lib

      - name: Initialize Tauri iOS project
        run: |
          npx tauri ios init

      - name: Setup iOS Rust Build Stub and Populate Libraries
        run: |
          chmod +x scripts/ios-rust-stub.sh
          cp -f scripts/ios-rust-stub.sh /tmp/ios-rust-stub.sh

          LIB_SRC="src-tauri/target/aarch64-apple-ios/release/libmeowave_lib.a"
          if [ ! -f "$LIB_SRC" ]; then
            echo "Error: Precompiled Rust lib not found at $LIB_SRC"
            exit 1
          fi
          echo "Precompiled Rust lib verified: $LIB_SRC ($(ls -lh "$LIB_SRC" | awk '{print $5}'))"

          # Populate all possible Externals directories in src-tauri/gen/apple
          find src-tauri/gen/apple -type d | while read -r d; do
            case "$d" in
              *apple|*meowave)
                for conf in release Release debug Debug; do
                  for arch in arm64 aarch64; do
                    mkdir -p "$d/Externals/$arch/$conf"
                    cp -f "$LIB_SRC" "$d/Externals/$arch/$conf/libapp.a"
                    cp -f "$LIB_SRC" "$d/Externals/$arch/$conf/libmeowave_lib.a"
                    cp -f "$LIB_SRC" "$d/Externals/$arch/$conf/libmeowave.a"
                  done
                done
                ;;
            esac
          done

      - name: Ensure Xcode Project Compatibility
        run: |
          python3 - << 'EOF'
          import glob

          for pbx in glob.glob("src-tauri/gen/apple/**/project.pbxproj", recursive=True):
              print(f"Patching {pbx} for broad Xcode compatibility and stubbing Rust script")
              with open(pbx, "r", encoding="utf-8") as f:
                  lines = f.readlines()

              out_lines = []
              in_rust_script = False
              replaced = False
              for line in lines:
                  if "objectVersion = 77;" in line:
                      line = line.replace("objectVersion = 77;", "objectVersion = 60;")

                  if "tauri ios xcode-script" in line:
                      out_lines.append('\t\t\tshellScript = "/bin/sh /tmp/ios-rust-stub.sh\\n";\n')
                      replaced = True
                      if not line.strip().endswith('";'):
                          in_rust_script = True
                      continue

                  if in_rust_script:
                      if line.strip().endswith('";'):
                          in_rust_script = False
                      continue

                  out_lines.append(line)

              with open(pbx, "w", encoding="utf-8") as f:
                  f.writelines(out_lines)
              print(f"Patched {pbx} (Rust script phase replaced: {replaced})")
          EOF

      - name: Enable Background Audio in Info.plist
        run: |
          find src-tauri/gen/apple -name "Info.plist" | while read -r plist; do
            echo "Injecting UIBackgroundModes (audio) into $plist"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$plist" 2>/dev/null || true
          done

      - name: Build iOS App with Xcode
        run: |
          # Clean any stale server-addr file
          rm -f "${TMPDIR}"*server-addr /tmp/*server-addr 2>/dev/null || true

          PROJECT=$(find src-tauri/gen/apple -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Error: Xcode project not found in src-tauri/gen/apple"
            exit 1
          fi
          echo "Found Xcode project: $PROJECT"

          TARGET=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Targets:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | grep -i ios | head -n 1)
          if [ -z "$TARGET" ]; then
            TARGET=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Targets:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | head -n 1)
          fi
          if [ -z "$TARGET" ]; then
            TARGET="meowave_iOS"
          fi

          SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | grep -i ios | head -n 1)
          if [ -z "$SCHEME" ]; then
            SCHEME="$TARGET"
          fi

          CONFIG=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Build Configurations:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | grep -i release | head -n 1)
          CONFIG=${CONFIG:-"Release"}

          echo "Building scheme: $SCHEME (target: $TARGET, config: $CONFIG)"

          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | grep -v "Intermediate" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Compiled .app bundle not found in build/Build/Products"
            find build/Build/Products -maxdepth 4 || true
            exit 1
          fi
          echo "Found application bundle: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r Meowave.ipa Payload
          ls -lh Meowave.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meowave-iOS-IPA
          path: Meowave.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Meowave.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
