      <rect width="100" height="120" rx="12" fill="#B87AFF" />
      <text x="50" y="30" fill="#1A0038" font-size="10" font-weight="700" text-anchor="middle">TONE 70</text>
      <text x="50" y="60" fill="#1A0038" font-size="13" font-weight="700" text-anchor="middle">Secondary</text>
      <rect x="15" y="86" width="70" height="20" rx="6" fill="#1A0038" fill-opacity="0.12" />
      <text x="50" y="100" fill="#1A0038" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">#B87AFF</text>
