    <g transform="translate(712, 0)">
      <rect width="166" height="96" rx="12" fill="#362a4d" stroke="#564377" stroke-width="1" />
      <text x="16" y="28" fill="#f43f5e" font-size="11" font-weight="700">LEVEL 4 · TOP</text>
      <text x="16" y="48" fill="#FFFFFF" font-size="12" font-weight="600">Toasts &amp; Popovers</text>
      <text x="16" y="68" fill="#9f9aa8" font-size="10.5">SurfaceContainerHighest</text>
      <text x="16" y="84" fill="#696472" font-size="9.5">Elevation 8dp</text>
    </g>
