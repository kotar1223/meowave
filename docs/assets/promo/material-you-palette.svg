      <text x="50" y="30" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle">TONE 50</text>
      <text x="50" y="60" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle">Primary M3</text>
      <rect x="15" y="86" width="70" height="20" rx="6" fill="#000000" fill-opacity="0.25" />
      <text x="50" y="100" fill="#FFFFFF" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">#9A46FF</text>
    </g>

