    <g transform="translate(178, 0)">
      <rect width="166" height="96" rx="12" fill="#201b2c" stroke="#352c47" stroke-width="1" />
      <text x="16" y="28" fill="#a78bfa" font-size="11" font-weight="700">LEVEL 1 · LOW</text>
      <text x="16" y="48" fill="#FFFFFF" font-size="12" font-weight="600">Sidebar &amp; Nav</text>
      <text x="16" y="68" fill="#9f9aa8" font-size="10.5">SurfaceContainerLow</text>
      <text x="16" y="84" fill="#696472" font-size="9.5">Elevation 1dp</text>
    </g>

    <!-- Container 3 -->
    <g transform="translate(356, 0)">
      <rect width="166" height="96" rx="12" fill="#262035" stroke="#403457" stroke-width="1" />
      <text x="16" y="28" fill="#c084fc" font-size="11" font-weight="700">LEVEL 2 · CARD</text>
      <text x="16" y="48" fill="#FFFFFF" font-size="12" font-weight="600">Media Cards</text>
      <text x="16" y="68" fill="#9f9aa8" font-size="10.5">SurfaceContainer</text>
      <text x="16" y="84" fill="#696472" font-size="9.5">Elevation 3dp</text>
    </g>

    <!-- Container 4 -->
    <g transform="translate(534, 0)">
      <rect width="166" height="96" rx="12" fill="#2d253f" stroke="#4a3c66" stroke-width="1" />
      <text x="16" y="28" fill="#e879f9" font-size="11" font-weight="700">LEVEL 3 · HIGH</text>
      <text x="16" y="48" fill="#FFFFFF" font-size="12" font-weight="600">Dialogs &amp; Drawers</text>
      <text x="16" y="68" fill="#9f9aa8" font-size="10.5">SurfaceContainerHigh</text>
      <text x="16" y="84" fill="#696472" font-size="9.5">Elevation 6dp</text>
    </g>

