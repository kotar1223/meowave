    <g transform="translate(222, 0)">
      <rect width="100" height="120" rx="12" fill="#EAD7FF" />
      <text x="50" y="30" fill="#2A0054" font-size="10" font-weight="700" text-anchor="middle">TONE 90</text>
      <text x="50" y="60" fill="#2A0054" font-size="13" font-weight="700" text-anchor="middle">Container</text>
      <rect x="15" y="86" width="70" height="20" rx="6" fill="#2A0054" fill-opacity="0.1" />
      <text x="50" y="100" fill="#2A0054" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">#EAD7FF</text>
