      <text x="50" y="30" fill="#38006E" font-size="10" font-weight="700" text-anchor="middle">TONE 80</text>
      <text x="50" y="60" fill="#38006E" font-size="13" font-weight="700" text-anchor="middle">Accent Soft</text>
      <rect x="15" y="86" width="70" height="20" rx="6" fill="#38006E" fill-opacity="0.12" />
      <text x="50" y="100" fill="#38006E" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">#D0A7FF</text>
