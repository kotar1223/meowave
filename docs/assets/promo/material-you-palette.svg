      <text x="16" y="28" fill="#7dd3fc" font-size="11" font-weight="700">LEVEL 0 · FLAT</text>
      <text x="16" y="48" fill="#FFFFFF" font-size="12" font-weight="600">Base Surface</text>
      <text x="16" y="68" fill="#9f9aa8" font-size="10.5">Window root canvas</text>
      <text x="16" y="84" fill="#696472" font-size="9.5">Elevation 0dp</text>
