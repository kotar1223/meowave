<svg viewBox="0 0 960 380" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="m3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121019" />
      <stop offset="100%" stop-color="#191524" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A46FF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="380" rx="18" fill="url(#m3bg)" stroke="#2b263b" stroke-width="1.5" />
  <rect x="20" y="20" width="920" height="70" rx="12" fill="url(#glow)" />

  <!-- Header -->
  <text x="40" y="48" fill="#D0A7FF" font-size="11" font-weight="700" letter-spacing="1.8">MATERIAL DESIGN 3 EXPRESSIVE</text>
  <text x="40" y="74" fill="#FFFFFF" font-size="19" font-weight="600">Dynamic OKLCH Tonal Hierarchy &amp; Elevation Matrix</text>

  <!-- Badges in Header -->
  <g transform="translate(620, 38)">
    <rect width="94" height="26" rx="13" fill="#292042" stroke="#4A3470" stroke-width="1" />
    <text x="47" y="17" fill="#EAD7FF" font-size="11" font-weight="600" text-anchor="middle">29 Color Roles</text>
  </g>
  <g transform="translate(724, 38)">
    <rect width="104" height="26" rx="13" fill="#1b283d" stroke="#2a4569" stroke-width="1" />
    <text x="52" y="17" fill="#7dd3fc" font-size="11" font-weight="600" text-anchor="middle">WCAG AAA 7.1:1</text>
  </g>
  <g transform="translate(838, 38)">
    <rect width="82" height="26" rx="13" fill="#2d1c2a" stroke="#522947" stroke-width="1" />
    <text x="41" y="17" fill="#fda4af" font-size="11" font-weight="600" text-anchor="middle">OKLCH Space</text>
  </g>

  <!-- Tonal Swatches Row (8 chips) -->
  <g transform="translate(40, 110)">
    <!-- Swatch 1: Tone 98 -->
    <g transform="translate(0, 0)">
      <rect width="100" height="120" rx="12" fill="#FAF5FF" stroke="#EAD7FF" stroke-width="1" />
      <text x="50" y="30" fill="#1A0038" font-size="10" font-weight="700" text-anchor="middle">TONE 98</text>
      <text x="50" y="60" fill="#1A0038" font-size="13" font-weight="700" text-anchor="middle">Surface Lowest</text>
      <rect x="15" y="86" width="70" height="20" rx="6" fill="#1A0038" fill-opacity="0.08" />
      <text x="50" y="100" fill="#1A0038" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">#FAF5FF</text>
    </g>

    <!-- Swatch 2: Tone 95 -->
    <g transform="translate(111, 0)">
      <rect width="100" height="120" rx="12" fill="#F5EDFF" stroke="#D0A7FF" stroke-width="1" />
      <text x="50" y="30" fill="#1A0038" font-size="10" font-weight="700" text-anchor="middle">TONE 95</text>
      <text x="50" y="60" fill="#1A0038" font-size="13" font-weight="700" text-anchor="middle">Surface</text>
      <rect x="15" y="86" width="70" height="20" rx="6" fill="#1A0038" fill-opacity="0.08" />
      <text x="50" y="100" fill="#1A0038" font-size="11" font-family="monospace" font-weight="600" text-anchor="middle">#F5EDFF</text>
